name: courtocr
description: Court document OCR scanner with editable review and Excel export.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  file_picker: ^8.1.7
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.19.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
