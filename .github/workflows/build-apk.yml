name: Build Court OCR Scanner APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify source files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "class CourtOcrApp" lib/main.dart
      - name: Generate or repair Android project files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ] || \
             { [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; }; then
            echo "Android Gradle wrapper or app-level Gradle file is missing; regenerating Android scaffolding in the CI workspace."
            rm -rf android
            flutter create --platforms=android --org com.courtocr --project-name court_ocr_scanner .
          fi
          test -f android/gradlew
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Flutter did not generate an app-level Gradle file."
            exit 1
          fi
      - name: Ensure Android network permission and compatible SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<manifest", '<manifest')
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', content, count=1)
          manifest.write_text(content)
          for gradle in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")):
              if not gradle.exists():
                  continue
              g = gradle.read_text()
              g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              g = g.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              g = g.replace("isMinifyEnabled = true", "isMinifyEnabled = false")
              g = g.replace("minifyEnabled true", "minifyEnabled false")
              gradle.write_text(g)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify and upload APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
