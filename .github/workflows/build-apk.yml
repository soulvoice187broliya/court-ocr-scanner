name: Build Court OCR Scanner APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Check Flutter project files
    shell: bash
    run: |
      set -euo pipefail

      echo "Repository location:"
      pwd

      echo "Files in repository:"
      ls -la

      if [ ! -f pubspec.yaml ]; then
        echo "::error::pubspec.yaml is missing from the repository root."
        exit 1
      fi

      if [ ! -f lib/main.dart ]; then
        echo "::error::lib/main.dart is missing."
        echo "Ensure the Flutter source is committed under lib/main.dart."
        exit 1
      fi

      echo "Flutter project files found."
      flutter --version

  - name: Generate missing Android project files
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f android/gradlew ] ||
         { [ ! -f android/app/build.gradle ] &&
           [ ! -f android/app/build.gradle.kts ]; }; then
        echo "Android Gradle files are missing or incomplete."
        flutter create --platforms=android \
          --org com.courtocr \
          --project-name court_ocr_scanner .
      else
        echo "Existing Android project files found."
      fi

      test -f android/gradlew
      chmod +x android/gradlew

  - name: Download Flutter dependencies
    run: flutter pub get

  - name: Analyze Dart source
    run: flutter analyze

  - name: Run Flutter tests
    shell: bash
    run: |
      set -euo pipefail
      if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
        flutter test
      else
        echo "No Flutter test files found; skipping tests."
      fi

  - name: Build release APK
    run: flutter build apk --release

  - name: Verify APK
    shell: bash
    run: |
      set -euo pipefail

      APK="build/app/outputs/flutter-apk/app-release.apk"

      if [ ! -s "$APK" ]; then
        echo "::error::APK was not created or is empty."
        exit 1
      fi

      ls -lh "$APK"
      sha256sum "$APK"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Court-OCR-Scanner-APK
      path: build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 14