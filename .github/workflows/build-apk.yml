name: Build Court OCR Scanner APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android Release APK
runs-on: ubuntu-latest
timeout-minutes: 45

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Check source files
    run: |
      test -f pubspec.yaml || {
        echo "ERROR: pubspec.yaml is missing from repository root."
        exit 1
      }
      test -f lib/main.dart || {
        echo "ERROR: lib/main.dart is missing from repository root."
        exit 1
      }

  - name: Generate Android project
    run: |
      flutter create \
        --platforms=android \
        --org com.courtocr \
        --project-name court_ocr_scanner \
        /tmp/generated

  - name: Copy OCR application source
    run: |
      cp pubspec.yaml /tmp/generated/pubspec.yaml
      cp -R lib/. /tmp/generated/lib/

      if [ -d assets ]; then
        cp -R assets /tmp/generated/
      fi

      if [ -f pubspec.lock ]; then
        cp pubspec.lock /tmp/generated/pubspec.lock
      fi

  - name: Install Flutter dependencies
    working-directory: /tmp/generated
    run: flutter pub get

  - name: Check Flutter and Android configuration
    working-directory: /tmp/generated
    run: flutter doctor -v

  - name: Build release APK
    working-directory: /tmp/generated
    run: flutter build apk --release

  - name: Verify APK
    run: |
      APK="/tmp/generated/build/app/outputs/flutter-apk/app-release.apk"
      test -s "$APK" || {
        echo "ERROR: APK was not generated."
        exit 1
      }
      ls -lh "$APK"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Court-OCR-Scanner-APK
      path: /tmp/generated/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 14
