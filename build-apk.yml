name: Build Court OCR Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          test -f pubspec.yaml || (echo "Missing root pubspec.yaml"; exit 1)
          test -f lib/main.dart || (echo "Missing lib/main.dart; upload the extracted Dart source, not only the ZIP"; exit 1)
          test -f .github/workflows/build-apk.yml || (echo "Missing build workflow"; exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project wrapper
        run: |
          flutter create --platforms=android --org com.courtocr --project-name courtocr /tmp/generated
          cp "$GITHUB_WORKSPACE/pubspec.yaml" /tmp/generated/pubspec.yaml
          rm -rf /tmp/generated/lib
          cp -r "$GITHUB_WORKSPACE/lib" /tmp/generated/lib
          cd /tmp/generated
          flutter pub get
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Court-OCR-Scanner-APK
          path: /tmp/generated/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
